    <script>
        const backToTopButton = document.querySelector('.back-to-top');

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'
            });
        }

        function updateBackToTopVisibility() {
            const showButton = window.scrollY > window.innerHeight * 0.65;
            backToTopButton.classList.toggle('is-visible', showButton);
        }

        backToTopButton.addEventListener('click', scrollToTop);
        window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
        updateBackToTopVisibility();

        const lazyCardBackgrounds = document.querySelectorAll('.card-bg-image[data-bg]');

        function loadCardBackground(element) {
            if (element.classList.contains('is-loading') || element.classList.contains('is-loaded')) {
                return;
            }

            element.classList.add('is-loading');
            const image = new Image();
            image.decoding = 'async';
            image.onload = () => {
                element.style.backgroundImage = `url("${element.dataset.bg}")`;
                element.classList.remove('is-loading');
                element.classList.add('is-loaded');
            };
            image.onerror = () => {
                element.classList.remove('is-loading');
                element.classList.add('is-load-error');
            };
            image.src = element.dataset.bg;
        }

        if ('IntersectionObserver' in window) {
            const cardBackgroundObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) {
                        return;
                    }

                    loadCardBackground(entry.target);
                    observer.unobserve(entry.target);
                });
            }, {
                rootMargin: '0px',
                threshold: 0.05
            });

            lazyCardBackgrounds.forEach((background) => cardBackgroundObserver.observe(background));
        } else {
            lazyCardBackgrounds.forEach(loadCardBackground);
        }
    </script>
