<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="dark-mode home-page">

    <div class="background-blur"></div>

    <aside class="floating-buttons">
        <button type="button" class="float-btn back-to-top" data-hud-icon="up" aria-label="回到顶部"
            title="回到顶部"></button>
    </aside>

    <div class="container">

        <header class="navbar">
            <div class="nav-left">
                <a href="/index.html" class="nav-logo">同济SuperPower</a>
            </div>
            <nav class="nav-right">
                <a href="/index.html" class="nav-link">Home</a>
                <a href="/about/about.html" class="nav-link">About</a>
                <a href="https://space.bilibili.com/651837546/lists/6386496?type=season" class="nav-link"
                    target="_blank">Lectures</a>
                <div class="nav-divider"></div>
                <a href="https://github.com/TongjiSuperPower" class="nav-icon" title="">Github</a>
                <a href="https://space.bilibili.com/651837546" class="nav-icon" title="">Bilibili</a>
            </nav>
        </header>

        <main class="hero">
            <div class="hero-content">
                <h1><span class="gradient-text">SuperPower's</span></h1>

            </div>
            <div class="hero-logo">
                <img src="/images/brand/superpower-logo.png" alt="SuperPower Logo">
            </div>
        </main>

        <section class="project-grid">
            <a href="/openSource/openSource.html">
                <article class="project-card">
                    <div class="card-icon" data-hud-icon="book"></div>
                    <h3>开源汇总</h3>
                    <p>一起共建开源环境</p>
                    <p>人人为我，我为人人</p>
                    <div class="card-bg-image"
                        style="background-image: url(https://api.star-history.com/svg?repos=TongjiSuperPower/sp_vision_25&type=Date);">
                    </div>
                </article>
            </a>

            <a href="/members/members.html">
                <article class="project-card">
                    <div class="card-icon" data-hud-icon="users"></div>
                    <h3>优秀队员展示</h3>
                    <p>一支优秀的队伍源自一群优秀队员</p>
                    <div class="card-bg-image" style="background-image: url('/images/team/seasons/2025-gs.jpg');"></div>
                </article>
            </a>

            <a href="/robots/timeline.html">
                <article class="project-card">
                    <div class="card-icon" data-hud-icon="bot"></div>
                    <h3>机器人介绍</h3>
                    <p>一众优秀的机器人为队伍立下汗马功劳</p>
                    <div class="card-bg-image" style="background-image:url('/images/open-source/ascento.jpg');"></div>
                </article>
            </a>

            <a href="/competition/competition.html">
                <article class="project-card">
                    <div class="card-icon" data-hud-icon="gamepad"></div>
                    <h3>精彩赛事</h3>
                    <p>志豪杯现已开赛</p>
                    <div class="card-bg-image" style="background-image: url('/images/competition/champion.jpg');"></div>
                </article>
            </a>

            <a href="/surroundings/surroundings.html">
                <article class="project-card">
                    <div class="card-icon" data-hud-icon="package"></div>
                    <h3>周边商城</h3>
                    <p>精心设计的周边翘首以盼</p>
                    <div class="card-bg-image" style="background-image: url('/images/store/store-cover.jpg');"></div>
                </article>
            </a>

            <a href="/communication/communication.html">
                <article class="project-card">
                    <div class="card-icon" data-hud-icon="mail"></div>
                    <h3>联系我们</h3>
                    <p>欢迎任何赞助、交流活动</p>
                    <div class="card-bg-image" style="background-image: url('/images/contact/contact-card.png');"></div>
                </article>
            </a>

        </section>

    </div>

    <footer class="home-footer">
        <p>Copyright © 2025 SuperPower. All rights reserved.</p>
    </footer>

    <script>
        const backToTopButton = document.querySelector('.back-to-top');

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        function updateBackToTopVisibility() {
            const showButton = window.scrollY > window.innerHeight * 0.65;
            backToTopButton.classList.toggle('is-visible', showButton);
        }

        backToTopButton.addEventListener('click', scrollToTop);
        window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
        updateBackToTopVisibility();
    </script>
</body>

</html>
