<body class="dark-mode">

    <aside class="floating-buttons">

    <div class="container">

            </nav>
        </header>

        <main class="contact-page">

            <div class="contact-header">
                <h1>Let's Connect</h1>
                <p class="subtitle">热烈欢迎各大企业、高校与我们交流联系！<br>无论是技术探讨还是商务合作，我们都期待您的声音。</p>
            </div>

            <div class="contact-grid">

                <article class="platform-card email-card">
                    <div class="card-header">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                        </div>
                        <h2>官方邮箱</h2>
                    </div>
                    <p class="card-desc">商务合作、技术咨询或加入我们。</p>
                    <div class="card-content highlight-bg">
                        <code>2253884@tongji.edu.cn</code>
                    </div>
                    <a href="mailto:2253884@tongji.edu.cn" class="card-btn">发送邮件 <span data-hud-icon="external"></span></a>
                </article>

                <article class="platform-card bilibili-card">
                    <div class="card-header">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="20" height="15" x="2" y="7" rx="2" ry="2" />
                                <polyline points="17 2 12 7 7 2" />
                            </svg>
                        </div>
                        <h2>Bilibili</h2>
                    </div>
                    <p class="card-desc">观看我们的公开课、比赛实录及技术分享。</p>

                    <div class="img-wrapper">
                        <img src="/images/contact/bilibili-qr.jpg" alt="Bilibili QR Code" class="qr-img">
                    </div>
                    <p class="sub-hint">搜索 "TJ-SuperPower战队"</p>
                    <a href="https://space.bilibili.com/651837546" target="_blank" class="card-btn">访问主页 <span data-hud-icon="external"></span></a>
                </article>

                <article class="platform-card xhs-card">
                    <div class="card-header">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M2 8.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 4-6 9-9 9-3-5-9-9-9-9Z" />
                            </svg>
                        </div>
                        <h2>小红书</h2>
                    </div>
                    <p class="card-desc">关注我们的日常动态和战队生活瞬间。</p>

                    <div class="img-wrapper">
                        <img src="/images/contact/rednote-qr.png" alt="Xiaohongshu QR Code" class="qr-img">
                    </div>
                    <p class="sub-hint">小红书号：27488192325</p>
                    <a href="https://www.xiaohongshu.com/user/profile/68de0689000000003702e32c" target="_blank"
                        class="card-btn">查看主页 <span data-hud-icon="external"></span></a>
                </article>

            </div>
        </main>

    </div>

    <script>
        // 逻辑保持不变，优化了选择器命名
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme');

        // 初始化图标和状态
        if (currentTheme === 'light') {
            body.classList.remove('dark-mode');
            HUD.setIcon(themeToggleBtn, 'moon');
        } else {
            // 默认为 dark-mode (HTML tag上有class)
            if (!body.classList.contains('dark-mode')) {
                body.classList.add('dark-mode');
            }
            HUD.setIcon(themeToggleBtn, 'sun');
        }

        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                HUD.setIcon(themeToggleBtn, 'sun');
                localStorage.setItem('theme', 'dark');
            } else {
                HUD.setIcon(themeToggleBtn, 'moon');
                localStorage.setItem('theme', 'light');
            }
        });
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth' // 平滑滚动
            });
        }
    </script>
</body>

</html>
